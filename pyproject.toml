[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mantle-restoration"
version = "0.1.0"
description = "Mechanism-aware nonanticipative restoration for coupled power, communication, and mission systems"
requires-python = ">=3.11"
dependencies = [
  "networkx==3.6.1",
  "numpy==2.2.6",
  "pandas==2.2.3",
  "pandapower==3.1.2",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
  "scipy==1.16.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

